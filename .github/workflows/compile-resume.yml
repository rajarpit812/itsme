name: Compile Resume (LaTeX → PDF)

on:
  push:
    paths:
      - 'resume/**'
  workflow_dispatch:          # Allow manual trigger from the Actions tab

permissions:
  contents: write             # Needed to commit the compiled PDF back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX → PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume/main.tex
          extra_packages: "moderncv fontawesome etoolbox xcolor ifnottex lm pgf multirow arydshln changepage"

      - name: Move compiled PDF to assets/
        run: |
          mkdir -p assets
          cp resume/main.pdf assets/resume.pdf
          echo "✅ PDF compiled successfully ($(du -h assets/resume.pdf | cut -f1))"

      - name: Commit & push updated PDF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/resume.pdf
          # Only commit if the PDF actually changed
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-compile resume PDF [skip ci]"
          git push
