name: Compile Resume (LaTeX → PDF)

on:
  push:
    paths:
      - 'resume/**'
      - '.github/workflows/compile-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX → PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume/main.tex
          extra_packages: >-
            moderncv
            fontawesome5
            etoolbox
            xcolor
            pgf
            microtype
            fancyhdr
            lm
            multirow
            arydshln
            changepage
            booktabs
            geometry
            hyperref
            url
            ifnottex
            tools
            colortbl
            tcolorbox
            environ
            trimspaces

      - name: Move compiled PDF to assets/
        run: |
          mkdir -p assets
          cp resume/main.pdf assets/resume.pdf
          echo "✅ PDF ready ($(du -h assets/resume.pdf | cut -f1))"

      - name: Commit & push updated PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/resume.pdf
          git diff --cached --name-only
          git commit -m "chore: auto-compile resume PDF [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:main
