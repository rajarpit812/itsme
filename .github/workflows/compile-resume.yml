name: Compile Resume (LaTeX → PDF)

on:
  push:
    paths:
      - 'resume/**'
  workflow_dispatch:          # Allow manual trigger from the Actions tab

permissions:
  contents: write             # Needed to commit the compiled PDF back

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest    # Full TeX Live — all packages included
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX → PDF
        run: |
          cd resume
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
          echo "✅ Compiled successfully"
          ls -lh main.pdf

      - name: Move compiled PDF to assets/
        run: |
          mkdir -p assets
          cp resume/main.pdf assets/resume.pdf
          echo "✅ PDF ready ($(du -h assets/resume.pdf | cut -f1))"

      - name: Commit & push updated PDF
        run: |
          git config --global --safe.directory "*"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/resume.pdf
          # Only commit if the PDF actually changed
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: auto-compile resume PDF [skip ci]"
          git push
