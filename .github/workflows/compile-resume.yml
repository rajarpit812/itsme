name: Compile Resume (LaTeX → PDF)

on:
  push:
    paths:
      - 'resume/**'
      - '.github/workflows/compile-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live (with moderncv)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra

      - name: Compile LaTeX → PDF
        run: |
          cd resume
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          echo "✅ Compiled successfully"
          ls -lh main.pdf

      - name: Move compiled PDF to assets/
        run: |
          mkdir -p assets
          cp resume/main.pdf assets/resume.pdf
          echo "✅ PDF ready ($(du -h assets/resume.pdf | cut -f1))"

      - name: Commit & push updated PDF
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/resume.pdf
          git commit -m "chore: auto-compile resume PDF [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:main
