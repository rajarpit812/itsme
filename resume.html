<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dcrlp6ryj/image/upload/v1752761651/Gemini_Generated_Image_at81xmat81xmat81_ypkyiq.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Arpit Raj</title>
    <meta name="description" content="Arpit Raj's resume — ECE undergrad exploring VLSI Design & Data Science Analytics.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F8F7;
            color: #1a1a1a;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'DM Sans', sans-serif;
        }
        .fade-in {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeIn 0.6s 0.2s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        /* Make the iframe fill all available vertical space below the header */
        .pdf-wrapper {
            height: calc(100vh - 88px); /* 88px ≈ header height */
        }
        /* Skeleton loader while PDF loads */
        .pdf-skeleton {
            background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="antialiased">

    <!-- Header (matches site-wide nav) -->
    <header class="fixed top-0 left-0 right-0 z-10 bg-[#F8F8F7]/80 backdrop-blur-sm">
        <div class="container mx-auto px-6 md:px-10 py-6 flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold tracking-wide">Arpit Raj</a>
            <nav class="flex items-center space-x-6">
                <a href="index.html#projects" class="text-lg text-stone-600 hover:text-black transition-colors duration-300">Work</a>
                <a href="resume.html" class="text-lg text-black font-semibold transition-colors duration-300">Resume</a>
                <a href="index.html#contact" class="text-lg text-stone-600 hover:text-black transition-colors duration-300">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main: full-height PDF viewer -->
    <main class="pt-[88px]">
        <div class="pdf-wrapper relative fade-in">
            <!-- Skeleton loader (hidden once iframe loads) -->
            <div id="pdf-skeleton" class="absolute inset-0 pdf-skeleton flex items-center justify-center">
                <p class="text-stone-400 text-lg">Loading resume…</p>
            </div>

            <iframe
                id="pdf-viewer"
                class="w-full h-full border-0 relative z-[1] opacity-0 transition-opacity duration-500"
                title="Arpit Raj — Resume"
                loading="eager"
            ></iframe>
        </div>

        <!-- Fallback / download bar -->
        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-sm border-t border-stone-200 py-3 px-6 flex items-center justify-between z-10 fade-in" style="animation-delay:0.4s">
            <p class="text-sm text-stone-500 hidden sm:block">Can't see the PDF? Download it directly.</p>
            <a id="download-link" href="assets/resume.pdf" download class="inline-flex items-center gap-2 bg-black text-white text-sm px-5 py-2.5 rounded-lg hover:bg-stone-800 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/>
                </svg>
                Download PDF
            </a>
        </div>
    </main>

    <script>
        (function () {
            const PDF_PATH = 'assets/resume.pdf';
            const iframe   = document.getElementById('pdf-viewer');
            const skeleton = document.getElementById('pdf-skeleton');
            const dlLink   = document.getElementById('download-link');

            // Cache-busting: append a timestamp so browsers always fetch the latest PDF
            const cacheBust = '?v=' + Date.now();
            const pdfUrl    = PDF_PATH + cacheBust;

            iframe.src = pdfUrl;
            dlLink.href = PDF_PATH; // download link stays clean (no cache-bust needed)

            iframe.addEventListener('load', function () {
                iframe.classList.remove('opacity-0');
                iframe.classList.add('opacity-100');
                skeleton.style.display = 'none';
            });

            // If the iframe fails to render (e.g. mobile), hide it and show a message
            iframe.addEventListener('error', function () {
                skeleton.innerHTML = '<p class="text-stone-500 text-lg">Your browser cannot display this PDF. Please use the download button below.</p>';
            });
        })();
    </script>

</body>
</html>
